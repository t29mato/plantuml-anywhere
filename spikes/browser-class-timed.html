<!doctype html>
<html>
<head><meta charset="utf-8"><title>spike-timed</title></head>
<body>
<div id="out">loading...</div>
<script>window.__T0__ = performance.now();</script>
<script src="./node_modules/@plantuml/core/viz-global.js"></script>
<script type="module">
  window.__T_SCRIPTS_LOADED__ = performance.now();
  import { renderToString } from "./node_modules/@plantuml/core/plantuml.js";
  window.__T_MODULE_IMPORTED__ = performance.now();

  const puml = [
    "@startuml",
    "class Animal {",
    "  +name: String",
    "  +makeSound()",
    "}",
    "class Dog {",
    "  +bark()",
    "}",
    "class Engine {",
    "  +horsepower: int",
    "}",
    "Animal <|-- Dog",
    "Dog *-- Engine",
    "@enduml",
  ];

  window.__T_RENDER_CALL__ = performance.now();
  renderToString(
    puml,
    (svg) => {
      window.__T_RENDER_DONE__ = performance.now();
      window.__SPIKE_RESULT__ = { ok: true, svg };
      document.getElementById("out").innerHTML = svg;
    },
    (err) => {
      window.__SPIKE_RESULT__ = { ok: false, error: String(err) };
    }
  );
</script>
</body>
</html>
