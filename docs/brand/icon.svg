<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC3F7"/>
      <stop offset="1" stop-color="#2E9FE6"/>
    </linearGradient>
    <clipPath id="boxClip">
      <rect x="40" y="36" width="48" height="58" rx="7"/>
    </clipPath>
    <!-- front half of the orbit, in the orbit's rotated frame -->
    <clipPath id="orbitFront">
      <rect x="-70" y="0" width="140" height="40"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- orbit: back half (behind the class box) -->
  <g transform="translate(64 66) rotate(-16)">
    <ellipse rx="52" ry="19" fill="none" stroke="#F5A623" stroke-opacity="0.6" stroke-width="4"/>
  </g>

  <!-- class box shadow -->
  <rect x="42" y="41" width="48" height="58" rx="7" fill="#000000" opacity="0.35"/>

  <!-- UML class box -->
  <rect x="40" y="36" width="48" height="58" rx="7" fill="#F6F9FC"/>
  <g clip-path="url(#boxClip)">
    <!-- header compartment -->
    <rect x="40" y="36" width="48" height="18" fill="url(#hdr)"/>
    <!-- header "title" line -->
    <rect x="48" y="43" width="24" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.92"/>
    <!-- attribute compartment lines -->
    <rect x="48" y="60" width="28" height="4" rx="2" fill="#8FA6BD"/>
    <rect x="48" y="68" width="20" height="4" rx="2" fill="#8FA6BD"/>
    <!-- compartment divider -->
    <rect x="40" y="76" width="48" height="2.4" fill="#AEC2D4"/>
    <!-- method compartment lines -->
    <rect x="48" y="83" width="26" height="4" rx="2" fill="#8FA6BD"/>
  </g>
  <rect x="40" y="36" width="48" height="58" rx="7" fill="none" stroke="#0B1220" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- orbit: front half (passes over the class box) -->
  <g transform="translate(64 66) rotate(-16)">
    <g clip-path="url(#orbitFront)">
      <ellipse rx="52" ry="19" fill="none" stroke="#F5A623" stroke-width="4.5"/>
    </g>
    <!-- satellite on the front arc -->
    <circle cx="-38.5" cy="12.8" r="6.5" fill="#F5A623"/>
    <circle cx="-38.5" cy="12.8" r="6.5" fill="none" stroke="#0B1220" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="-40.5" cy="10.8" r="2" fill="#FFE3AE"/>
  </g>
</svg>
